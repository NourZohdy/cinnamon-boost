<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cinnamon Boost settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>
      <img src="../../icons/logo.svg" width="24" height="24" alt="">
      Cinnamon Boost
    </strong>
    <span>Settings</span>
  </header>
  <section id="update-banner" aria-labelledby="update-version" hidden>
    <strong id="update-version" role="status"></strong>
    <ol>
      <li>Double-click <strong>update.cmd</strong> in your <strong>cinnamon-boost</strong> folder.</li>
      <li>Click Reload extension.</li>
      <li>Refresh the Label Studio tab.</li>
    </ol>
    <div class="update-actions">
      <button id="reload-extension" class="link" type="button">Reload extension</button>
      <a id="release-link" class="link" target="_blank" rel="noopener">What's new</a>
    </div>
  </section>
  <section>
    <div class="heading">Mode <span id="custom" hidden>Custom</span></div>
    <div id="presets" role="radiogroup" aria-label="Mode"></div>
  </section>
  <main id="sections"></main>
  <footer>
    <p id="status" role="status" hidden></p>
    <div>
      <button id="reset" class="link" disabled>Reset to defaults</button>
      <button id="check-update" class="link" type="button">Check for updates</button>
    </div>
    <details class="footer-about">
      <summary><span id="version"></span> · <span class="about-label">About</span></summary>
      <div class="about-panel">
        <strong class="about-title">
          <img src="../../icons/logo.svg" width="24" height="24" alt="">
          <span>Cinnamon Boost <span id="about-version"></span></span>
        </strong>
        <p>Made by Nour Tammous</p>
        <a href="https://github.com/NourZohdy/cinnamon-boost" target="_blank" rel="noopener">github.com/NourZohdy/cinnamon-boost</a>
      </div>
    </details>
    <p id="update-result" role="status"></p>
  </footer>
  <script src="../shared/settings.js"></script>
  <script src="../shared/update.js"></script>
  <script src="popup.js"></script>
</body>
</html>
