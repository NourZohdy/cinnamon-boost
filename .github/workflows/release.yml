name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag
        run: |
          $version = (Get-Content -Raw manifest.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match manifest version v$version"
          }
          "CINNAMON_BOOST_VERSION=$version" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $env:CINNAMON_BOOST_VERSION
          # ponytail: legacy asset for 0.32.0 updaters; drop once everyone is on 0.33+
          $legacyZip = 'dist/ls-sound-only.zip'
          Copy-Item -LiteralPath dist/cinnamon-boost.zip -Destination $legacyZip
          gh release create "$tag" dist/cinnamon-boost.zip "$legacyZip" --title "Cinnamon Boost $version" --generate-notes --verify-tag
